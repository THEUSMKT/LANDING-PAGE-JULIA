# Site estático: não há build. A Netlify publica a pasta do projeto como está.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Fotos em cache por 7 dias (se trocar uma foto mantendo o mesmo nome,
# quem já visitou o site pode ver a antiga por até 7 dias)
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
